services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    networks:
      default:
        aliases: ["ledgerlens-api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
  web:
    build: .
    ports: ["8080:8080"]
    depends_on:
      api:
        condition: service_healthy
