server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://ledgerlens-api:8000/api/; }
  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location /health { proxy_pass http://ledgerlens-api:8000/health; }
  location /metrics { proxy_pass http://ledgerlens-api:8000/metrics; }
}
