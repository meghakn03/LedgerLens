name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend -p 'test_*.py' -v
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
      - name: Validate Kubernetes manifests
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workdir" -w /workdir ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary deploy/kubernetes.yaml
      - run: docker build -t ledgerlens-web:ci .
      - run: docker build -t ledgerlens-api:ci ./backend
